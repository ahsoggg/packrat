[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app", "crates/sevenzip-plugin", "crates/sfx"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahsoggg-creator/packrat"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
