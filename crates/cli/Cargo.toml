[package]
name = "packrat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Packrat command-line archiver"

[[bin]]
name = "packrat-cli"
path = "src/main.rs"

[dependencies]
packrat-core = { path = "../core" }
blake3 = "1.8.2"
crc32fast = "1.5.2"
sha1 = "0.11.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
encoding_rs = "0.8.42"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
