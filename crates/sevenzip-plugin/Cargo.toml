[package]
name = "packrat-7zip-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A 7-Zip format plugin (packrat7z.dll) that lets 7-Zip list, test and extract .prat archives"

[lib]
name = "packrat7z"
crate-type = ["cdylib", "rlib"]

[dependencies]
packrat-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
